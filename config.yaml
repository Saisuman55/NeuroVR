# NeuroVR 3D — Configuration
# Research prototype — NOT for clinical diagnosis

seed: 42

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name: brats_mri_segmentation
  source: monai_zoo
  version: "0.4.2"
  cache_dir: models/monai/brats_mri_segmentation
  description: >
    MONAI BraTS MRI Segmentation model from the official MONAI Model Zoo.
    Input: 4-channel [T1, T1ce, T2, FLAIR] volumetric MRI
    Output: 3-channel [TC, WT, ET] tumor region masks

# ── Input ─────────────────────────────────────────────────────────────────────
input:
  supported_formats:
    - .nii
    - .nii.gz
    - .dcm         # via DICOM adapter
  modalities:
    - t1            # T1-weighted (structural)
    - t1ce          # T1 with contrast enhancement
    - t2            # T2-weighted
    - flair         # T2-FLAIR (perilesional edema)
  max_upload_bytes: 524288000   # 500 MB per file

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  target_spacing:               # mm per voxel
    - 1.0
    - 1.0
    - 1.0
  roi_size:                     # Sliding-window patch size — 64 for fast CPU demo
    - 64
    - 64
    - 64
  normalization: z_score        # z_score | min_max
  crop_foreground: true

# ── Inference ─────────────────────────────────────────────────────────────────
inference:
  overlap: 0.25                 # Reduced for fast CPU demo (0.5 for production)
  sw_batch_size: 1              # Patches per forward pass
  device: auto                  # auto | cuda | mps | cpu
  threshold: 0.5                # Probability threshold for binary mask

# ── Reconstruction ────────────────────────────────────────────────────────────
reconstruction:
  smoothing: 3                  # Laplacian smoothing iterations (0 = off)
  minimum_component_size: 100   # Voxels — smaller components are removed
  marching_cubes_step: 1        # Step size (1 = full res, 2 = half res)
  brain_surface_step: 2         # Step size for brain surface mesh

# ── Visualization ─────────────────────────────────────────────────────────────
visualization:
  default_opacity:
    brain: 0.18
    tumor_whole: 0.88
    tumor_core: 0.90
    tumor_enhancing: 0.92
  tumor_colors:
    whole: "#0ea5e9"            # Cyan-blue
    core: "#ef4444"             # Red
    enhancing: "#f59e0b"        # Amber

# ── WebXR ─────────────────────────────────────────────────────────────────────
webxr:
  enabled: true
  ar_features:
    - local
    - hit-test
  vr_features:
    - local-floor
    - bounded-floor
    - hand-tracking

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  # Path to BraTS training directory (override with BRATS_DATASET_PATH env var)
  brats_path: data/raw/brats
  # Patient-level split fractions (must sum to 1.0)
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  # Random seed for reproducible patient splitting
  split_seed: 42

# ── Training (2D U-Net) ────────────────────────────────────────────────────────
training_2d:
  epochs: 30
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-5
  loss: dice_ce          # dice | dice_ce | dice_focal
  early_stopping: 10
  patch_size: 240
  orientation: axial
  tumor_ratio: 0.6
  output_dir: results/2d

# ── Training (3D SegResNet) ────────────────────────────────────────────────────
training_3d:
  epochs: 50
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-5
  loss: dice_ce
  early_stopping: 15
  patch_size: "64,64,64"   # D,H,W
  architecture: segresnet   # segresnet | unet3d
  output_dir: results/3d
  # Optional: path to pretrained MONAI bundle weights for fine-tuning
  pretrained: null          # e.g. models/monai/brats_mri_segmentation/models/model.pt

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  outputs: outputs
  models: models
  demo_data: data/real_brats
  results_2d: results/2d
  results_3d: results/3d

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 7861
  debug: false
  threaded: true